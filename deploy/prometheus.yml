global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: workers
    static_configs:
      - targets:
          - worker-outbox:9100
          - worker-settlement:9100
          - worker-feed:9100
          - worker-staleness:9100
