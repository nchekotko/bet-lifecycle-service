[project]
name = "bet-lifecycle-service"
version = "0.1.0"
description = "Sportsbook backend: feed ingestion, market management, bet placement, double-entry ledger, settlement and resettlement"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikolay Chekotko" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "aiokafka>=0.11",
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[project.scripts]
bet-lifecycle = "bet_lifecycle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bet_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs running PostgreSQL / Redpanda / Redis (skipped when unavailable)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT018"]
